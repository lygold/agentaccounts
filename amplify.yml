version: 1
frontend:
  phases:
    preBuild:
      commands:
        # nvm auto-reinstalls whatever's listed in ~/.nvm/default-packages
        # into any newly `nvm install`ed version — Amplify's build image
        # ships that file pre-populated with @aws-amplify/cli, bower,
        # cypress, grunt-cli, hugo-extended, vuepress, yarn, none of which
        # this project uses. That reinstall costs ~70s every single build;
        # emptying the file first skips it. Safe no-op if the file doesn't
        # exist yet.
        - mkdir -p ~/.nvm && > ~/.nvm/default-packages
        - nvm install 22 && nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify Hosting does NOT expose console env vars to the Next.js SSR
        # runtime by default — write the ones the app reads into .env.production
        # so process.env has them at request time. Values are redirected to the
        # file, not printed to the build log.
        # BROKER_/META_APP_SECRET/META_WEBHOOK_VERIFY_TOKEN added for the
        # referrals feature (Phase 9) — BROKER_ was missing here entirely
        # (would've silently never reached the app even if set in Amplify
        # Console); META_WABA_ alone didn't cover the other two.
        - env | grep -E '^(SESSION_SECRET|UPSTASH_|MONDAY_|META_WABA_|META_APP_SECRET|META_WEBHOOK_VERIFY_TOKEN|MAKE_|GREEN_INVOICE_|DYNAMODB_TABLE_|DYNAMO_REGION|S3_ATTACHMENTS_BUCKET|BOOTSTRAP_ADMIN_|OFFICE_ID|SYNC_SECRET|ANTHROPIC_API_KEY|GOOGLE_|SECRETARY_|PROPERTY_NOTIFY_|BROKER_|NEXT_PUBLIC_)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
