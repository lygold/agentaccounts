version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify Hosting does NOT expose console env vars to the Next.js SSR
        # runtime by default — write the ones the app reads into .env.production
        # so process.env has them at request time. Values are redirected to the
        # file, not printed to the build log.
        - env | grep -E '^(SESSION_SECRET|UPSTASH_|MONDAY_|META_WABA_|MAKE_OTP_WEBHOOK_URL|GREEN_INVOICE_|DYNAMODB_TABLE_|DYNAMO_REGION|S3_ATTACHMENTS_BUCKET|BOOTSTRAP_ADMIN_|OFFICE_ID|SYNC_SECRET|NEXT_PUBLIC_)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
