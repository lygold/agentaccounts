name: Green Invoice poll fallback

# Backstop for webhook deliveries GI drops (ROADMAP Phase 6). POSTs
# /api/green-invoice/poll, which re-checks recent GI documents and processes
# any receipt the webhook handler missed. Safe to run any time.
#
# Setup: repo secret SYNC_SECRET (same one the agents sync uses), optional
# repo variable APP_URL.

on:
  schedule:
    - cron: "30 5 * * *" # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: gi-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/green-invoice/poll
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://main.d2aqfzo6esnq4n.amplifyapp.com' }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then
            echo "::error::SYNC_SECRET repo secret is not set"
            exit 1
          fi
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
            -X POST "$APP_URL/api/green-invoice/poll" \
            -H "Authorization: Bearer $SYNC_SECRET")
          echo "HTTP $code"
          cat /tmp/body.json; echo
          test "$code" = "200"
